<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Vault</title>
<style>
:root {
  --radius: 13px;
  --radius-lg: 18px;
  --radius-sm: 9px;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  --tr: 0.18s cubic-bezier(0.4,0,0.2,1);
  --sidebar-w: 240px;
}
[data-theme="dark"] {
  --bg:        #000;
  --bg2:       #111;
  --bg3:       #1a1a1a;
  --s1:        rgba(255,255,255,0.06);
  --s2:        rgba(255,255,255,0.09);
  --s3:        rgba(255,255,255,0.14);
  --b1:        rgba(255,255,255,0.09);
  --b2:        rgba(255,255,255,0.16);
  --t1:        rgba(255,255,255,0.90);
  --t2:        rgba(255,255,255,0.52);
  --t3:        rgba(255,255,255,0.28);
  --accent:    rgba(255,255,255,0.92);
  --atxt:      #000;
  --red:       #ff453a;
  --redbg:     rgba(255,69,58,0.13);
  --green:     #30d158;
  --greenbg:   rgba(48,209,88,0.12);
  --shadow:    0 2px 20px rgba(0,0,0,0.55);
  --shadowlg:  0 8px 48px rgba(0,0,0,0.75);
  --glass:     rgba(18,18,18,0.82);
}
[data-theme="light"] {
  --bg:        #f2f2f7;
  --bg2:       #fff;
  --bg3:       #f2f2f7;
  --s1:        rgba(0,0,0,0.04);
  --s2:        rgba(0,0,0,0.07);
  --s3:        rgba(0,0,0,0.11);
  --b1:        rgba(0,0,0,0.08);
  --b2:        rgba(0,0,0,0.15);
  --t1:        rgba(0,0,0,0.88);
  --t2:        rgba(0,0,0,0.50);
  --t3:        rgba(0,0,0,0.28);
  --accent:    rgba(0,0,0,0.88);
  --atxt:      #fff;
  --red:       #ff3b30;
  --redbg:     rgba(255,59,48,0.10);
  --green:     #34c759;
  --greenbg:   rgba(52,199,89,0.10);
  --shadow:    0 2px 20px rgba(0,0,0,0.07);
  --shadowlg:  0 8px 48px rgba(0,0,0,0.13);
  --glass:     rgba(242,242,247,0.85);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t1);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── APP SHELL ─────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ───────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--glass);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border-right:1px solid var(--b1);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-head{padding:20px 16px 12px;border-bottom:1px solid var(--b1)}
.sb-title{font-size:18px;font-weight:600;letter-spacing:-.4px}
.sb-sub{font-size:11px;color:var(--t3);margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:0 0 12px}
.sb-scroll::-webkit-scrollbar{width:0}
.sb-section{padding:14px 10px 4px}
.sb-section-label{font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);padding:0 6px;margin-bottom:4px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--t2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all var(--tr)}
.nav:hover{background:var(--s2);color:var(--t1)}
.nav.active{background:var(--s3);color:var(--t1);font-weight:500}
.nav-ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.nav-cnt{margin-left:auto;font-size:11px;color:var(--t3);background:var(--s2);padding:1px 7px;border-radius:8px;min-width:20px;text-align:center}
.nav.trash{color:var(--red)}
.nav.trash .nav-cnt{color:var(--red);background:var(--redbg)}
.sb-foot{padding:10px 10px;border-top:1px solid var(--b1);display:flex;gap:8px;align-items:center}
.theme-btn{width:32px;height:32px;border-radius:50%;background:var(--s1);border:1px solid var(--b1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all var(--tr);flex-shrink:0}
.theme-btn:hover{background:var(--s2)}
.new-folder-btn{flex:1;padding:7px 10px;border-radius:var(--radius-sm);background:var(--s1);border:1px solid var(--b1);font-family:var(--font);font-size:12px;color:var(--t2);cursor:pointer;transition:all var(--tr);display:flex;align-items:center;gap:6px}
.new-folder-btn:hover{background:var(--s2);color:var(--t1)}

/* ── MAIN ──────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{padding:14px 24px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);flex-shrink:0}
.view-title{font-size:17px;font-weight:600;letter-spacing:-.3px;flex:1}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search-wrap input{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:7px 12px 7px 30px;font-family:var(--font);font-size:13px;color:var(--t1);width:210px;outline:none;transition:all var(--tr)}
.search-wrap input::placeholder{color:var(--t3)}
.search-wrap input:focus{border-color:var(--b2);background:var(--s2);width:250px}

.btn{padding:7px 15px;border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all var(--tr);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-fill{background:var(--accent);color:var(--atxt)}
.btn-fill:hover{opacity:.85;transform:scale(.98)}
.btn-ghost{background:var(--s1);color:var(--t2);border:1px solid var(--b1)}
.btn-ghost:hover{background:var(--s2);color:var(--t1)}
.btn-red{background:var(--redbg);color:var(--red);border:1px solid transparent}
.btn-red:hover{background:rgba(255,59,48,.22)}
.btn-green{background:var(--greenbg);color:var(--green);border:1px solid transparent}
.btn-green:hover{background:rgba(52,199,89,.22)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}

/* ── CONTENT ───────────────────────────────────── */
.content{flex:1;overflow-y:auto;padding:24px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}

/* folder meta bar */
.folder-meta{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.folder-meta-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.folder-meta h2{font-size:20px;font-weight:600;letter-spacing:-.4px}
.folder-meta-actions{margin-left:auto;display:flex;gap:8px}

/* trash note */
.trash-note{background:var(--redbg);border:1px solid rgba(255,59,48,.15);border-radius:var(--radius);padding:11px 15px;margin-bottom:16px;font-size:12px;color:var(--red);line-height:1.6;display:flex;gap:8px}
.trash-topbar{display:flex;justify-content:flex-end;margin-bottom:14px}

/* url grid */
.url-grid{display:flex;flex-direction:column;gap:5px}
.url-card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--radius);padding:11px 14px;display:flex;align-items:center;gap:12px;transition:all var(--tr);animation:fadeUp .2s ease;position:relative;overflow:hidden}
.url-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fc,transparent);border-radius:3px 0 0 3px;opacity:.65}
.url-card:hover{background:var(--s2);border-color:var(--b2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.favicon{width:28px;height:28px;min-width:28px;background:var(--s1);border:1px solid var(--b1);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden}
.favicon img{width:15px;height:15px;object-fit:contain}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.card-url{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-family:'SF Mono','Menlo','Monaco',monospace;letter-spacing:-.2px}
.card-url:hover{color:var(--t2)}
.folder-tag{font-size:10px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--s1);border:1px solid var(--b1);color:var(--t3);white-space:nowrap;letter-spacing:.2px}
.card-actions{display:flex;gap:4px;opacity:0;transition:opacity var(--tr)}
.url-card:hover .card-actions{opacity:1}
.icon-btn{width:27px;height:27px;border-radius:7px;background:var(--s1);border:1px solid var(--b1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr);color:var(--t2)}
.icon-btn svg{width:12px;height:12px}
.icon-btn:hover{background:var(--s2);color:var(--t1);border-color:var(--b2)}
.icon-btn.del:hover{background:var(--redbg);color:var(--red);border-color:var(--redbg)}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--t3);gap:10px;text-align:center}
.empty-ico{font-size:38px;opacity:.3}
.empty h3{font-size:15px;font-weight:500;color:var(--t2)}
.empty p{font-size:12px;line-height:1.7;max-width:240px}

/* ── MODALS ────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--radius-lg);padding:24px;width:350px;max-width:93vw;box-shadow:var(--shadowlg);transform:scale(.94) translateY(10px);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.overlay.show .modal{transform:scale(1) translateY(0)}
.modal h3{font-size:16px;font-weight:600;letter-spacing:-.3px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:18px}
.mrow{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.mlabel{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.modal input,.modal select{background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius-sm);padding:9px 12px;font-family:var(--font);font-size:13px;color:var(--t1);outline:none;width:100%;transition:all var(--tr)}
.modal input::placeholder{color:var(--t3)}
.modal input:focus,.modal select:focus{border-color:var(--b2);background:var(--s2)}
.modal select{appearance:none;-webkit-appearance:none;cursor:pointer}
.modal select option{background:var(--bg2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.color-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all var(--tr);flex-shrink:0}
.swatch:hover{transform:scale(1.2)}
.swatch.sel{border-color:var(--t1);transform:scale(1.15)}
.emoji-name-row{display:flex;gap:8px}
.emoji-name-row .emoji-in{width:50px;text-align:center;font-size:16px}
.emoji-name-row .name-in{flex:1}

/* ── TOAST ─────────────────────────────────────── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--t1);box-shadow:var(--shadowlg);backdrop-filter:blur(30px);z-index:999;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <!-- ════ SIDEBAR ════ -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-title">URL Vault</div>
      <div class="sb-sub">Deine Links, sicher gespeichert</div>
    </div>
    <div class="sb-scroll">
      <div class="sb-section">
        <div class="sb-section-label">Bibliothek</div>
        <button class="nav active" id="nav-all" onclick="setView('all')">
          <span class="nav-ic" style="background:var(--s2)">📂</span>
          <span style="flex:1;text-align:left">Alle Links</span>
          <span class="nav-cnt" id="cnt-all">0</span>
        </button>
        <button class="nav" id="nav-recent" onclick="setView('recent')">
          <span class="nav-ic" style="background:var(--s2)">🕐</span>
          <span style="flex:1;text-align:left">Zuletzt hinzugefügt</span>
        </button>
      </div>
      <div class="sb-section">
        <div class="sb-section-label">Ordner</div>
        <div id="folderNav"></div>
      </div>
      <div class="sb-section">
        <button class="nav trash" id="nav-trash" onclick="setView('trash')">
          <span class="nav-ic" style="background:var(--redbg)">🗑</span>
          <span style="flex:1;text-align:left">Zuletzt gelöscht</span>
          <span class="nav-cnt" id="cnt-trash" style="display:none">0</span>
        </button>
      </div>
    </div>
    <div class="sb-foot">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Design wechseln">🌙</button>
      <button class="new-folder-btn" onclick="openNewFolder()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Neuer Ordner
      </button>
    </div>
  </aside>

  <!-- ════ MAIN ════ -->
  <main class="main">
    <div class="topbar">
      <div class="view-title" id="viewTitle">Alle Links</div>
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Suchen…" oninput="renderContent()">
      </div>
      <button class="btn btn-fill btn-sm" onclick="openAddModal()">+ URL</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- ════ ADD URL MODAL ════ -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3>URL hinzufügen</h3>
    <p>Speichere einen neuen Link in deinem Vault.</p>
    <div class="mrow"><div class="mlabel">URL</div><input type="url" id="m-url" placeholder="https://…"></div>
    <div class="mrow"><div class="mlabel">Name (optional)</div><input type="text" id="m-name" placeholder="Wird automatisch erkannt"></div>
    <div class="mrow"><div class="mlabel">Ordner</div><select id="m-folder"></select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeOverlay('addOverlay')">Abbrechen</button>
      <button class="btn btn-fill" onclick="addUrl()">Speichern</button>
    </div>
  </div>
</div>

<!-- ════ FOLDER MODAL ════ -->
<div class="overlay" id="folderOverlay">
  <div class="modal">
    <h3 id="fModalTitle">Neuer Ordner</h3>
    <div class="mrow">
      <div class="mlabel">Emoji & Name</div>
      <div class="emoji-name-row">
        <input type="text" id="f-emoji" class="emoji-in" value="📁" maxlength="2">
        <input type="text" id="f-name" class="name-in" placeholder="z.B. Schule, Arbeit…">
      </div>
    </div>
    <div class="mrow">
      <div class="mlabel">Farbe</div>
      <div class="color-row" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeOverlay('folderOverlay')">Abbrechen</button>
      <button class="btn btn-fill" id="fSaveBtn" onclick="saveFolder()">Erstellen</button>
    </div>
  </div>
</div>

<!-- ════ CONFIRM MODAL ════ -->
<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="c-title"></h3>
    <p id="c-text"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeOverlay('confirmOverlay')">Abbrechen</button>
      <button class="btn btn-red" id="c-btn">Löschen</button>
    </div>
  </div>
</div>

<!-- ════ TOAST ════ -->
<div class="toast" id="toast"></div>

<script>
// ── Storage ─────────────────────────────────────
const K = { urls:'vlt_u3', folders:'vlt_f3', trash:'vlt_t3', theme:'vlt_th' };
const load = k => { try { return JSON.parse(localStorage.getItem(k))||[]; } catch { return []; } };
const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));

let urls    = load(K.urls);
let folders = load(K.folders);
let trash   = load(K.trash);
let theme   = localStorage.getItem(K.theme) || 'dark';
let view    = 'all';
let editFId = null;
let selColor = '#0a84ff';
let confirmCb = null;

const COLORS = ['#0a84ff','#30d158','#ff9f0a','#ff453a','#bf5af2','#ff375f','#64d2ff','#ffd60a','#ac8e68','#8e8e93'];

// Default folders
if (!folders.length) {
  folders = [
    { id:'f1', name:'Arbeit',    emoji:'💼', color:'#0a84ff' },
    { id:'f2', name:'Schule',    emoji:'📚', color:'#30d158' },
    { id:'f3', name:'Privat',    emoji:'🏠', color:'#ff9f0a' },
    { id:'f4', name:'Sonstiges', emoji:'📌', color:'#bf5af2' },
  ];
  save(K.folders, folders);
}

// ── Theme ───────────────────────────────────────
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem(K.theme, t);
}
function toggleTheme() { applyTheme(theme === 'dark' ? 'light' : 'dark'); }
applyTheme(theme);

// ── Sidebar ─────────────────────────────────────
function renderSidebar() {
  // folder list
  document.getElementById('folderNav').innerHTML = folders.map(f => `
    <button class="nav ${view===f.id?'active':''}" onclick="setView('${f.id}')">
      <span class="nav-ic" style="background:${f.color}22">${f.emoji}</span>
      <span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
      <span class="nav-cnt">${urls.filter(u=>u.fid===f.id).length||''}</span>
    </button>`).join('');

  // counts
  document.getElementById('cnt-all').textContent = urls.length;
  const tc = document.getElementById('cnt-trash');
  if (trash.length) { tc.textContent = trash.length; tc.style.display = ''; }
  else tc.style.display = 'none';

  // active lib items
  ['all','recent','trash'].forEach(v => {
    const el = document.getElementById('nav-'+v);
    if (el) el.classList.toggle('active', view === v);
  });
}

function setView(v) {
  view = v;
  document.getElementById('searchInput').value = '';
  renderSidebar();
  renderContent();
}

// ── Content ─────────────────────────────────────
function renderContent() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const el = document.getElementById('content');
  const title = document.getElementById('viewTitle');

  if (view === 'trash') { title.textContent = 'Zuletzt gelöscht'; renderTrash(el); return; }

  let items = [...urls];
  let folder = null;

  if (view === 'all') {
    title.textContent = 'Alle Links';
  } else if (view === 'recent') {
    title.textContent = 'Zuletzt hinzugefügt';
    items = items.sort((a,b)=>b.added-a.added).slice(0,25);
  } else {
    folder = folders.find(f=>f.id===view);
    title.textContent = folder ? `${folder.emoji} ${folder.name}` : 'Ordner';
    items = items.filter(u=>u.fid===view);
  }

  if (q) items = items.filter(u => u.name.toLowerCase().includes(q) || u.url.toLowerCase().includes(q));

  el.innerHTML = '';

  // folder header
  if (folder) {
    const meta = document.createElement('div');
    meta.className = 'folder-meta';
    meta.innerHTML = `
      <div class="folder-meta-icon" style="background:${folder.color}22">${folder.emoji}</div>
      <div><h2>${esc(folder.name)}</h2></div>
      <div class="folder-meta-actions">
        <button class="btn btn-ghost btn-sm" onclick="openEditFolder('${folder.id}')">Bearbeiten</button>
        <button class="btn btn-red btn-sm" onclick="confirmDeleteFolder('${folder.id}')">Löschen</button>
      </div>`;
    el.appendChild(meta);
  }

  if (!items.length) {
    el.insertAdjacentHTML('beforeend', `
      <div class="empty">
        <div class="empty-ico">🔗</div>
        <h3>Keine Links</h3>
        <p>Klicke auf „+ URL" oben rechts, um deinen ersten Link hinzuzufügen.</p>
      </div>`);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'url-grid';
  items.forEach(item => {
    const fobj = folders.find(f=>f.id===item.fid);
    const fav = `https://www.google.com/s2/favicons?sz=32&domain_url=${encodeURIComponent(item.url)}`;
    const card = document.createElement('div');
    card.className = 'url-card';
    if (fobj) card.style.setProperty('--fc', fobj.color);
    card.innerHTML = `
      <div class="favicon"><img src="${fav}" alt="" onerror="this.style.display='none'"></div>
      <div class="card-body">
        <div class="card-title">${esc(item.name)}</div>
        <div class="card-url" onclick="goUrl('${escA(item.url)}')" title="${escA(item.url)}">${domain(item.url)}</div>
      </div>
      ${fobj && view!==fobj.id?`<span class="folder-tag">${fobj.emoji} ${esc(fobj.name)}</span>`:''}
      <div class="card-actions">
        <button class="icon-btn" onclick="goUrl('${escA(item.url)}')" title="Öffnen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
        <button class="icon-btn" onclick="copy('${escA(item.url)}')" title="Kopieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="icon-btn del" onclick="deleteUrl(${item.id})" title="Löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

function renderTrash(el) {
  el.innerHTML = '';
  if (!trash.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">✓</div><h3>Papierkorb leer</h3><p>Hier erscheinen gelöschte Links.</p></div>`;
    return;
  }
  el.innerHTML = `
    <div class="trash-note"><span>⚠️</span><span>Gelöschte Links können wiederhergestellt oder endgültig entfernt werden.</span></div>
    <div class="trash-topbar"><button class="btn btn-red btn-sm" onclick="confirmPurgeAll()">Alle endgültig löschen</button></div>`;
  const grid = document.createElement('div');
  grid.className = 'url-grid';
  trash.forEach(item => {
    const fobj = folders.find(f=>f.id===item.fid);
    const fav = `https://www.google.com/s2/favicons?sz=32&domain_url=${encodeURIComponent(item.url)}`;
    const card = document.createElement('div');
    card.className = 'url-card';
    card.style.opacity = '.55';
    card.innerHTML = `
      <div class="favicon" style="opacity:.5"><img src="${fav}" alt="" onerror="this.style.display='none'"></div>
      <div class="card-body">
        <div class="card-title" style="text-decoration:line-through">${esc(item.name)}</div>
        <div class="card-url">${domain(item.url)} · Gelöscht ${ago(item.deletedAt)}</div>
      </div>
      ${fobj?`<span class="folder-tag">${fobj.emoji} ${esc(fobj.name)}</span>`:''}
      <div class="card-actions" style="opacity:1">
        <button class="icon-btn" style="color:var(--green);border-color:var(--greenbg)" onclick="restoreUrl(${item.id})" title="Wiederherstellen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="icon-btn del" onclick="purgeUrl(${item.id})" title="Endgültig löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

// ── URL CRUD ─────────────────────────────────────
function openAddModal() {
  const sel = document.getElementById('m-folder');
  const def = (view!=='all'&&view!=='recent'&&view!=='trash') ? view : folders[0]?.id || '';
  sel.innerHTML = folders.map(f=>`<option value="${f.id}" ${f.id===def?'selected':''}>${f.emoji} ${esc(f.name)}</option>`).join('');
  document.getElementById('m-url').value = '';
  document.getElementById('m-name').value = '';
  openOverlay('addOverlay');
  setTimeout(()=>document.getElementById('m-url').focus(), 120);
}

function addUrl() {
  let url = document.getElementById('m-url').value.trim();
  const name = document.getElementById('m-name').value.trim();
  const fid  = document.getElementById('m-folder').value;
  if (!url) { toast('Bitte eine URL eingeben.'); return; }
  if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://'+url;
  try { new URL(url); } catch { toast('Ungültige URL.'); return; }
  urls.unshift({ id: Date.now(), url, name: name||domain(url), fid, added: Date.now() });
  save(K.urls, urls);
  closeOverlay('addOverlay');
  renderSidebar(); renderContent();
  toast('Link gespeichert ✓');
}

function deleteUrl(id) {
  const i = urls.findIndex(u=>u.id===id);
  if (i===-1) return;
  const item = urls.splice(i,1)[0];
  item.deletedAt = Date.now();
  trash.unshift(item);
  save(K.urls, urls); save(K.trash, trash);
  renderSidebar(); renderContent();
  toast('In Papierkorb verschoben');
}

function restoreUrl(id) {
  const i = trash.findIndex(t=>t.id===id);
  if (i===-1) return;
  const item = trash.splice(i,1)[0];
  delete item.deletedAt;
  urls.unshift(item);
  save(K.urls, urls); save(K.trash, trash);
  renderSidebar(); renderContent();
  toast('Link wiederhergestellt ✓');
}

function purgeUrl(id) {
  confirm2('Endgültig löschen?', 'Dieser Link wird dauerhaft entfernt und kann nicht wiederhergestellt werden.', 'Löschen', () => {
    trash = trash.filter(t=>t.id!==id);
    save(K.trash, trash);
    renderSidebar(); renderContent();
    toast('Endgültig gelöscht');
  });
}

function confirmPurgeAll() {
  confirm2(`Alle ${trash.length} Links löschen?`, 'Der gesamte Papierkorb wird dauerhaft geleert.', 'Alle löschen', () => {
    trash = [];
    save(K.trash, trash);
    renderSidebar(); renderContent();
    toast('Papierkorb geleert');
  });
}

// ── Folder CRUD ──────────────────────────────────
function buildColorPicker(sel) {
  selColor = sel || COLORS[0];
  document.getElementById('colorPicker').innerHTML = COLORS.map(c =>
    `<div class="swatch ${c===selColor?'sel':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}

function pickColor(c) {
  selColor = c;
  document.querySelectorAll('.swatch').forEach(s => {
    s.classList.toggle('sel', s.style.background === c || s.style.backgroundColor === c);
  });
}

function openNewFolder() {
  editFId = null;
  document.getElementById('fModalTitle').textContent = 'Neuer Ordner';
  document.getElementById('fSaveBtn').textContent = 'Erstellen';
  document.getElementById('f-emoji').value = '📁';
  document.getElementById('f-name').value = '';
  buildColorPicker(COLORS[0]);
  openOverlay('folderOverlay');
  setTimeout(()=>document.getElementById('f-name').focus(), 120);
}

function openEditFolder(id) {
  const f = folders.find(x=>x.id===id);
  if (!f) return;
  editFId = id;
  document.getElementById('fModalTitle').textContent = 'Ordner bearbeiten';
  document.getElementById('fSaveBtn').textContent = 'Speichern';
  document.getElementById('f-emoji').value = f.emoji;
  document.getElementById('f-name').value = f.name;
  buildColorPicker(f.color);
  openOverlay('folderOverlay');
}

function saveFolder() {
  const emoji = document.getElementById('f-emoji').value.trim() || '📁';
  const name  = document.getElementById('f-name').value.trim();
  if (!name) { toast('Bitte einen Namen eingeben.'); return; }
  if (editFId) {
    const f = folders.find(x=>x.id===editFId);
    if (f) { f.emoji=emoji; f.name=name; f.color=selColor; }
  } else {
    folders.push({ id:'f'+Date.now(), name, emoji, color: selColor });
  }
  save(K.folders, folders);
  closeOverlay('folderOverlay');
  renderSidebar(); renderContent();
  toast(editFId ? 'Ordner aktualisiert' : 'Ordner erstellt ✓');
}

function confirmDeleteFolder(id) {
  const f = folders.find(x=>x.id===id);
  const n = urls.filter(u=>u.fid===id).length;
  confirm2(`„${f?.name}" löschen?`,
    n ? `Der Ordner wird gelöscht. Die ${n} enthaltenen Links bleiben ohne Ordner erhalten.`
      : 'Der Ordner ist leer und wird gelöscht.',
    'Ordner löschen', () => {
    urls.forEach(u=>{ if(u.fid===id) u.fid = folders.filter(x=>x.id!==id)[0]?.id||''; });
    folders = folders.filter(x=>x.id!==id);
    save(K.folders, folders); save(K.urls, urls);
    if (view===id) view='all';
    renderSidebar(); renderContent();
    toast('Ordner gelöscht');
  });
}

// ── Helpers ──────────────────────────────────────
function goUrl(u) { window.open(u,'_blank','noopener,noreferrer'); }
function copy(u) { navigator.clipboard.writeText(u).then(()=>toast('URL kopiert ✓')); }
function domain(u) { try { return new URL(u).hostname.replace('www.',''); } catch { return u; } }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
function ago(ts) {
  const d = Date.now()-ts;
  if (d<60000) return 'gerade eben';
  if (d<3600000) return `vor ${Math.floor(d/60000)} Min.`;
  if (d<86400000) return `vor ${Math.floor(d/3600000)} Std.`;
  return `vor ${Math.floor(d/86400000)} Tag${Math.floor(d/86400000)>1?'en':''}`;
}

// ── Overlays ─────────────────────────────────────
function openOverlay(id) { document.getElementById(id).classList.add('show'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('show'); })
);

// ── Confirm ──────────────────────────────────────
function confirm2(title, text, btn, cb) {
  document.getElementById('c-title').textContent = title;
  document.getElementById('c-text').textContent  = text;
  document.getElementById('c-btn').textContent   = btn;
  confirmCb = cb;
  openOverlay('confirmOverlay');
}
document.getElementById('c-btn').addEventListener('click', () => {
  if (confirmCb) confirmCb();
  closeOverlay('confirmOverlay');
  confirmCb = null;
});

// ── Toast ─────────────────────────────────────────
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── Keyboard ─────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape') document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
  if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openAddModal(); }
});
document.getElementById('m-url').addEventListener('keydown',  e=>{ if(e.key==='Enter') addUrl(); });
document.getElementById('m-name').addEventListener('keydown', e=>{ if(e.key==='Enter') addUrl(); });
document.getElementById('f-name').addEventListener('keydown', e=>{ if(e.key==='Enter') saveFolder(); });

// ── Init ──────────────────────────────────────────
renderSidebar();
renderContent();
</script>
</body>
</html>
