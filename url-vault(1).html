<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-light: rgba(255,255,255,0.14);
    --glass: rgba(255,255,255,0.035);
    --glass-strong: rgba(255,255,255,0.06);
    --text: rgba(255,255,255,0.88);
    --text-muted: rgba(255,255,255,0.38);
    --text-dim: rgba(255,255,255,0.55);
    --accent: rgba(255,255,255,0.9);
    --danger: rgba(255,80,80,0.75);
    --danger-soft: rgba(255,80,80,0.12);
    --restore: rgba(80,200,120,0.75);
    --restore-soft: rgba(80,200,120,0.1);
    --radius: 16px;
    --radius-sm: 10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background blobs */
  .bg-orbs {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.13;
    animation: drift 20s ease-in-out infinite;
  }
  .orb-1 { width: 600px; height: 600px; background: #3a6fff; top: -200px; left: -100px; animation-delay: 0s; }
  .orb-2 { width: 500px; height: 500px; background: #a855f7; bottom: -100px; right: -50px; animation-delay: -7s; }
  .orb-3 { width: 400px; height: 400px; background: #06b6d4; top: 40%; left: 40%; animation-delay: -13s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 30px) scale(0.95); }
  }

  .app {
    position: relative; z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--glass-strong);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  h1 {
    font-size: 22px; font-weight: 500; letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 13px; color: var(--text-muted); font-weight: 300; margin-left: 48px;
  }

  /* Tab Bar */
  .tabs {
    display: flex; gap: 4px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    width: fit-content;
    margin-bottom: 32px;
    backdrop-filter: blur(20px);
  }
  .tab {
    padding: 7px 18px;
    border-radius: 7px;
    font-size: 13px; font-weight: 400;
    color: var(--text-dim);
    cursor: pointer;
    border: none;
    background: transparent;
    transition: all 0.2s;
    position: relative;
    display: flex; align-items: center; gap-7: 6px;
  }
  .tab.active {
    background: var(--glass-strong);
    border: 1px solid var(--border-light);
    color: var(--text);
  }
  .tab:hover:not(.active) { color: var(--text); background: var(--surface-hover); }
  .tab-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 10px; font-weight: 500;
    width: 16px; height: 16px;
    border-radius: 50%;
    margin-left: 5px;
  }
  .tab-badge.hidden { display: none; }

  /* Add Form */
  .add-form {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 28px;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    transition: border-color 0.2s;
  }
  .add-form:focus-within {
    border-color: var(--border-light);
  }
  .form-row {
    display: flex; gap: 10px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .form-row:last-child { margin-bottom: 0; }
  .input-wrap {
    flex: 1; min-width: 180px; position: relative;
  }
  .input-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 6px; display: block;
  }
  input[type="text"], input[type="url"], select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 13px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  input::placeholder { color: var(--text-muted); }
  input:focus, select:focus {
    border-color: var(--border-light);
    background: var(--surface-hover);
  }
  select {
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  select option { background: #1a1b1e; }

  .btn {
    padding: 9px 20px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .btn-primary {
    background: rgba(255,255,255,0.9);
    color: #0e0f11;
    border-color: transparent;
  }
  .btn-primary:hover { background: #fff; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost {
    background: var(--surface);
    color: var(--text-dim);
    border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-light); }
  .btn-danger {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: rgba(255,80,80,0.2);
  }
  .btn-danger:hover { background: rgba(255,80,80,0.2); }
  .btn-restore {
    background: var(--restore-soft);
    color: var(--restore);
    border-color: rgba(80,200,120,0.2);
  }
  .btn-restore:hover { background: rgba(80,200,120,0.18); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }

  /* Search + Filter */
  .toolbar {
    display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.35; }
  .search-wrap input { padding-left: 34px; }
  .filter-select { width: 160px; }

  /* URL Cards */
  .section-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 12px; padding-left: 2px;
  }

  .url-list { display: flex; flex-direction: column; gap: 6px; }

  .url-card {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    display: flex; align-items: center; gap: 14px;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    transition: all 0.2s;
    animation: fadeIn 0.25s ease;
    cursor: default;
  }
  .url-card:hover {
    background: var(--glass-strong);
    border-color: var(--border-light);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .favicon {
    width: 28px; height: 28px; min-width: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; overflow: hidden;
  }
  .favicon img { width: 18px; height: 18px; object-fit: contain; }

  .url-info { flex: 1; min-width: 0; }
  .url-title {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .url-address {
    font-size: 11px; color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .url-address:hover { color: var(--text-dim); }

  .url-tag {
    font-size: 10px; font-weight: 500; padding: 3px 8px;
    border-radius: 5px; background: var(--surface); border: 1px solid var(--border);
    color: var(--text-muted); white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .url-actions {
    display: flex; gap: 5px; opacity: 0;
    transition: opacity 0.15s;
  }
  .url-card:hover .url-actions { opacity: 1; }

  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    color: var(--text-muted);
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-light); }
  .icon-btn.del:hover { background: var(--danger-soft); color: var(--danger); border-color: rgba(255,80,80,0.3); }
  .icon-btn svg { width: 13px; height: 13px; }

  /* Empty State */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted); font-size: 13px; line-height: 1.7;
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }

  /* Deleted tab panel */
  .deleted-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .deleted-note {
    font-size: 12px; color: var(--text-muted);
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(30,31,35,0.95);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 13px; color: var(--text);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    z-index: 999;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  /* Stats */
  .stats {
    display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    backdrop-filter: blur(20px);
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .stat-pill b { color: var(--text); font-weight: 500; }

  /* Divider by category */
  .cat-group { margin-bottom: 24px; }
  .cat-group-label {
    font-size: 10px; font-weight: 500; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 8px; padding-left: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .cat-group-label::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* Modal confirm */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: #16171a;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 360px; width: 90%;
    transform: scale(0.95); transition: transform 0.25s;
  }
  .overlay.show .modal { transform: scale(1); }
  .modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 580px) {
    .url-card { flex-wrap: wrap; }
    .url-actions { opacity: 1; }
    .form-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">⬡</div>
      <h1>URL Vault</h1>
    </div>
    <p class="subtitle">Alle deine Links — sicher an einem Ort.</p>
  </header>

  <!-- Stats -->
  <div class="stats" id="statsBar"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('vault')">Vault</button>
    <button class="tab" onclick="switchTab('deleted')" id="deletedTab">
      Zuletzt gelöscht
      <span class="tab-badge hidden" id="deletedBadge"></span>
    </button>
  </div>

  <!-- VAULT TAB -->
  <div id="vaultPanel">
    <!-- Add Form -->
    <div class="add-form">
      <div class="form-row">
        <div class="input-wrap" style="flex:2">
          <label class="input-label">URL</label>
          <input type="url" id="inputUrl" placeholder="https://beispiel.de" />
        </div>
        <div class="input-wrap">
          <label class="input-label">Name</label>
          <input type="text" id="inputName" placeholder="Mein Link" />
        </div>
      </div>
      <div class="form-row">
        <div class="input-wrap">
          <label class="input-label">Kategorie</label>
          <select id="inputCat">
            <option value="Allgemein">Allgemein</option>
            <option value="Arbeit">Arbeit</option>
            <option value="Design">Design</option>
            <option value="Dev">Dev</option>
            <option value="Social">Social</option>
            <option value="Shopping">Shopping</option>
            <option value="News">News</option>
            <option value="Tools">Tools</option>
            <option value="Sonstiges">Sonstiges</option>
          </select>
        </div>
        <div class="input-wrap" style="flex:0; display:flex; align-items:flex-end;">
          <button class="btn btn-primary" onclick="addUrl()">+ Hinzufügen</button>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Suchen…" oninput="renderVault()" />
      </div>
      <select class="filter-select" id="filterCat" onchange="renderVault()">
        <option value="">Alle Kategorien</option>
        <option>Allgemein</option><option>Arbeit</option><option>Design</option>
        <option>Dev</option><option>Social</option><option>Shopping</option>
        <option>News</option><option>Tools</option><option>Sonstiges</option>
      </select>
    </div>

    <div id="urlList"></div>
  </div>

  <!-- DELETED TAB -->
  <div id="deletedPanel" style="display:none">
    <div class="deleted-note">
      URLs hier werden nach 30 Tagen automatisch endgültig entfernt. Du kannst sie jederzeit wiederherstellen oder manuell löschen.
    </div>
    <div class="deleted-header">
      <span class="section-label">Gelöschte Links</span>
      <button class="btn btn-ghost btn-sm" onclick="confirmPurgeAll()">Alle endgültig löschen</button>
    </div>
    <div id="deletedList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Endgültig löschen?</h3>
    <p id="modalText">Dieser Link wird dauerhaft entfernt und kann nicht wiederhergestellt werden.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-danger" id="modalConfirmBtn">Endgültig löschen</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────
const STORE_KEY = 'url_vault_v1';
const TRASH_KEY = 'url_vault_trash_v1';

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
}
function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

let vault = load(STORE_KEY);
let trash = load(TRASH_KEY);
let currentTab = 'vault';
let modalCallback = null;

// ─── Tab ─────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('vaultPanel').style.display = tab === 'vault' ? '' : 'none';
  document.getElementById('deletedPanel').style.display = tab === 'deleted' ? '' : 'none';
  if (tab === 'deleted') renderDeleted();
}

// ─── Add URL ─────────────────────────────────────────────────
function addUrl() {
  let url = document.getElementById('inputUrl').value.trim();
  const name = document.getElementById('inputName').value.trim();
  const cat = document.getElementById('inputCat').value;

  if (!url) { showToast('Bitte eine URL eingeben.'); return; }
  if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

  try { new URL(url); } catch { showToast('Ungültige URL.'); return; }

  const entry = {
    id: Date.now(),
    url,
    name: name || getDomain(url),
    cat,
    added: Date.now()
  };
  vault.unshift(entry);
  save(STORE_KEY, vault);
  document.getElementById('inputUrl').value = '';
  document.getElementById('inputName').value = '';
  renderVault();
  updateStats();
  showToast('Link gespeichert ✓');
}

// ─── Delete (move to trash) ───────────────────────────────────
function deleteUrl(id) {
  const idx = vault.findIndex(v => v.id === id);
  if (idx === -1) return;
  const item = vault.splice(idx, 1)[0];
  item.deletedAt = Date.now();
  trash.unshift(item);
  save(STORE_KEY, vault);
  save(TRASH_KEY, trash);
  renderVault();
  updateStats();
  showToast('In "Zuletzt gelöscht" verschoben');
}

// ─── Restore ─────────────────────────────────────────────────
function restoreUrl(id) {
  const idx = trash.findIndex(t => t.id === id);
  if (idx === -1) return;
  const item = trash.splice(idx, 1)[0];
  delete item.deletedAt;
  vault.unshift(item);
  save(STORE_KEY, vault);
  save(TRASH_KEY, trash);
  renderDeleted();
  updateStats();
  showToast('Link wiederhergestellt ✓');
}

// ─── Purge (permanently delete from trash) ───────────────────
function purgeUrl(id) {
  openModal('Endgültig löschen?', 'Dieser Link wird dauerhaft entfernt und kann nicht wiederhergestellt werden.', 'Löschen', () => {
    trash = trash.filter(t => t.id !== id);
    save(TRASH_KEY, trash);
    renderDeleted();
    updateStats();
    showToast('Endgültig gelöscht');
  });
}

function confirmPurgeAll() {
  if (!trash.length) return;
  openModal('Alle endgültig löschen?', `${trash.length} Link${trash.length > 1 ? 's' : ''} werden dauerhaft entfernt. Diese Aktion kann nicht rückgängig gemacht werden.`, 'Alle löschen', () => {
    trash = [];
    save(TRASH_KEY, trash);
    renderDeleted();
    updateStats();
    showToast('Papierkorb geleert');
  });
}

// ─── Open URL ────────────────────────────────────────────────
function openUrl(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

// ─── Render Vault ─────────────────────────────────────────────
function renderVault() {
  const list = document.getElementById('urlList');
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('filterCat').value;

  let items = vault.filter(v => {
    const matchQ = !q || v.name.toLowerCase().includes(q) || v.url.toLowerCase().includes(q);
    const matchC = !cat || v.cat === cat;
    return matchQ && matchC;
  });

  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">⬡</div>Keine Links gefunden.<br><span style="font-size:11px;opacity:0.6">Füge deinen ersten Link hinzu.</span></div>`;
    return;
  }

  // Group by category
  const groups = {};
  items.forEach(item => {
    if (!groups[item.cat]) groups[item.cat] = [];
    groups[item.cat].push(item);
  });

  list.innerHTML = Object.entries(groups).map(([c, urls]) => `
    <div class="cat-group">
      <div class="cat-group-label">${c}</div>
      <div class="url-list">${urls.map(cardHtml).join('')}</div>
    </div>
  `).join('');
}

function cardHtml(item) {
  const domain = getDomain(item.url);
  const favicon = `https://www.google.com/s2/favicons?sz=32&domain_url=${encodeURIComponent(item.url)}`;
  return `
    <div class="url-card" id="card-${item.id}">
      <div class="favicon"><img src="${favicon}" alt="" onerror="this.style.display='none';this.parentElement.textContent='🔗'"/></div>
      <div class="url-info">
        <div class="url-title">${escHtml(item.name)}</div>
        <div class="url-address" onclick="openUrl('${escAttr(item.url)}')" title="${escAttr(item.url)}">${escHtml(domain)}</div>
      </div>
      <div class="url-tag">${escHtml(item.cat)}</div>
      <div class="url-actions">
        <button class="icon-btn" onclick="openUrl('${escAttr(item.url)}')" title="Öffnen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
        <button class="icon-btn" onclick="copyUrl('${escAttr(item.url)}')" title="Kopieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="icon-btn del" onclick="deleteUrl(${item.id})" title="Löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
}

// ─── Render Deleted ───────────────────────────────────────────
function renderDeleted() {
  const list = document.getElementById('deletedList');
  updateStats();

  if (!trash.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">✓</div>Papierkorb ist leer.</div>`;
    return;
  }

  list.innerHTML = `<div class="url-list">${trash.map(item => {
    const domain = getDomain(item.url);
    const favicon = `https://www.google.com/s2/favicons?sz=32&domain_url=${encodeURIComponent(item.url)}`;
    const ago = timeAgo(item.deletedAt);
    return `
      <div class="url-card" id="trash-${item.id}">
        <div class="favicon" style="opacity:0.5"><img src="${favicon}" alt="" onerror="this.style.display='none';this.parentElement.textContent='🔗'"/></div>
        <div class="url-info">
          <div class="url-title" style="opacity:0.6">${escHtml(item.name)}</div>
          <div class="url-address" style="opacity:0.5">${escHtml(domain)} · Gelöscht ${ago}</div>
        </div>
        <div class="url-tag" style="opacity:0.5">${escHtml(item.cat)}</div>
        <div class="url-actions" style="opacity:1">
          <button class="icon-btn" style="color:var(--restore);border-color:rgba(80,200,120,0.25)" onclick="restoreUrl(${item.id})" title="Wiederherstellen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="icon-btn del" onclick="purgeUrl(${item.id})" title="Endgültig löschen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
  }).join('')}</div>`;
}

// ─── Stats ────────────────────────────────────────────────────
function updateStats() {
  const bar = document.getElementById('statsBar');
  const badge = document.getElementById('deletedBadge');
  bar.innerHTML = `
    <div class="stat-pill"><b>${vault.length}</b> Links gespeichert</div>
    ${trash.length ? `<div class="stat-pill" style="color:var(--danger)"><b>${trash.length}</b> gelöscht</div>` : ''}
    ${vault.length ? `<div class="stat-pill"><b>${[...new Set(vault.map(v=>v.cat))].length}</b> Kategorien</div>` : ''}
  `;
  if (trash.length) {
    badge.textContent = trash.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

// ─── Copy ─────────────────────────────────────────────────────
function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => showToast('URL kopiert ✓'));
}

// ─── Modal ────────────────────────────────────────────────────
function openModal(title, text, btnLabel, cb) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalConfirmBtn').textContent = btnLabel;
  modalCallback = cb;
  document.getElementById('overlay').classList.add('show');
}
function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  modalCallback = null;
}
document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  if (modalCallback) modalCallback();
  closeModal();
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

// ─── Toast ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── Helpers ─────────────────────────────────────────────────
function getDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch { return url; }
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return 'gerade eben';
  if (d < 3600000) return `vor ${Math.floor(d/60000)} Min.`;
  if (d < 86400000) return `vor ${Math.floor(d/3600000)} Std.`;
  return `vor ${Math.floor(d/86400000)} Tagen`;
}

// ─── Enter key ───────────────────────────────────────────────
document.getElementById('inputUrl').addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });
document.getElementById('inputName').addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });

// ─── Init ─────────────────────────────────────────────────────
renderVault();
updateStats();
</script>
</body>
</html>
